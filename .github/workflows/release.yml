# Release builds: Linux AppImage and single-file Windows exe. A `v*` tag
# publishes them on the tag's release; "Run workflow" (or a push touching
# the packaging) builds the same artifacts without publishing.
name: release

on:
  push:
    tags: ["v*"]
    # Branch pushes build only when the packaging changes (GitHub skips
    # path filters on tag pushes, so tags always build and publish).
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    # Arch packages gst-plugins-rs (whipsink/whepsrc, docs/SCREENSHARE.md);
    # Ubuntu doesn't. Cost: the AppImage needs a recent glibc on the host.
    container: archlinux:base-devel
    steps:
      - name: system packages
        run: |
          pacman -Syu --noconfirm --needed git rustup clang opus libpulse pipewire librsvg \
            gstreamer gst-plugins-base-libs gst-plugins-good gst-plugins-bad gst-plugins-bad-libs \
            gst-plugins-ugly gst-plugin-va gst-plugin-webrtchttp libnice
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; rustup picks it up.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: packaging/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FastDiscord-x86_64.AppImage
          path: dist/FastDiscord-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      # The last release with MSI installers (1.28 switched to an .exe with
      # undocumented silent options). Its binaries include gst-plugins-rs.
      GST_VERSION: "1.26.11"
    steps:
      - uses: actions/checkout@v4
      # freedesktop.org flakes (503s, resets every ~1 MB), so the MSIs are
      # downloaded once per GST_VERSION and kept in the Actions cache.
      - id: gst-cache
        uses: actions/cache/restore@v4
        with:
          path: gst-msi
          key: gst-msi-${{ env.GST_VERSION }}
      - name: Download GStreamer MSIs
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          New-Item -ItemType Directory -Force gst-msi | Out-Null
          foreach ($msi in "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi", "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi") {
            # -C - resumes after each reset instead of starting over.
            curl.exe -fsSL --retry 1000 --retry-delay 2 --retry-all-errors -C - -o "gst-msi\$msi" "$base/$msi"
            if ($LASTEXITCODE) { throw "download of $msi failed" }
          }
      - if: steps.gst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gst-msi
          key: gst-msi-${{ env.GST_VERSION }}
      - name: GStreamer (runtime + devel)
        shell: pwsh
        run: |
          foreach ($msi in "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi", "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi") {
            Start-Process msiexec -Wait -ArgumentList "/i", "$PWD\gst-msi\$msi", "/passive", "INSTALLLEVEL=1000", "INSTALLDIR=C:\gstreamer"
          }
          $root = "C:\gstreamer\1.0\msvc_x86_64"
          if (-not (Test-Path "$root\bin\gst-inspect-1.0.exe")) { throw "GStreamer not installed at $root" }
          if (-not (Test-Path "$root\bin\pkg-config.exe")) { choco install -y pkgconfiglite }
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        run: packaging/windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FastDiscord-windows-x86_64.exe
          path: dist/FastDiscord-windows-x86_64.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One job creates the release and uploads everything, so parallel
      # uploads never race to create it (FockyTV lost assets that way).
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            cp "docs/releases/$GITHUB_REF_NAME.md" release-notes.md
          else
            printf '%s\n' "FastDiscord ${GITHUB_REF_NAME#v}" > release-notes.md
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md
