name: Bug/Crash Report
description: Create a bug or crash report for FastDiscord.
labels: [bug]
title: "[Bug] <title>"

body:
    - type: input
      id: fastdiscord-version
      attributes:
          label: FastDiscord Version
          placeholder: e.g. 0.1.0
      validations:
          required: true

    - type: input
      id: os
      attributes:
          label: Operating System
          placeholder: e.g. Windows 11, Fedora Linux 44 (GNOME), Arch Linux (Hyprland)
      validations:
          required: true

    - type: input
      id: install-method
      attributes:
          label: Install Method
          placeholder: e.g. AppImage, Windows exe, built from source
      validations:
          required: true

    - type: textarea
      id: bug-description
      attributes:
          label: What happens when the bug or crash occurs?
          description: Where does this bug or crash occur, when does it occur, etc.
          placeholder: The bug/crash happens sometimes when I do ..., causing this to not work/the app to crash. I think it happens because of ...
      validations:
          required: true

    - type: textarea
      id: expected-behaviour
      attributes:
          label: What is the expected behaviour?
          description: Simply detail what the expected behaviour is.
      validations:
          required: true

    - type: textarea
      id: steps-to-take
      attributes:
          label: How do you recreate this bug or crash?
          description: Give us a list of steps in order to recreate the bug or crash.
          placeholder: |
              1. Do ...
              2. Then ...
              3. Observe "the bug" or "the crash"
      validations:
          required: true

    - type: textarea
      id: crash-log
      attributes:
          label: Errors
          render: text
          description: Run FastDiscord from a terminal (`RUST_LOG=debug fastdiscord`) and paste the output around the error.
      validations:
          required: false

    - type: checkboxes
      id: agreement-check
      attributes:
          label: Request Agreement
          options:
              - label: I've searched existing issues and this hasn't been reported before
              - label: I am willing to submit a fix for this myself
