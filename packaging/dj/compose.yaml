services:
  dj:
    build: .
    image: fastdiscord-dj:local
    container_name: fastdiscord-dj
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
